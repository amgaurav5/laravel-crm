name: Deploy Krayin demo to Embarko

on:
  push:
    branches:
      - feature/viasocket-embed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embarko-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4

      - name: Prepare Composer lock for declared platform extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: calendar, gd, zip, pdo_mysql
          tools: composer:v2
      - name: Update lock metadata without changing dependency versions
        run: composer update --lock --no-install --ignore-platform-reqs --no-interaction

      - name: Build source archive
        run: |
          tar -czf /tmp/krayin-embed-demo.tar.gz \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./vendor' \
            --exclude='./node_modules' \
            --exclude='./storage/logs' \
            .

      - name: Submit deployment to Embarko
        env:
          EMBARKO_DEPLOY_TOKEN: ${{ secrets.KRAYIN }}
        run: |
          set -euo pipefail

          # First try the claimed, stable app name using the supplied secret.
          response="$(curl --silent --show-error -w '\n%{http_code}' \
            -X POST "https://ship.embarko.ai/apps" \
            -H "Authorization: Bearer $EMBARKO_DEPLOY_TOKEN" \
            -H "X-App-Name: krayin-viasocket-demo" \
            -H "Accept: application/json" \
            -F "source=@/tmp/krayin-embed-demo.tar.gz;type=application/gzip")"
          http_code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body"

          if [ "$http_code" = "401" ]; then
            echo "Embarko rejected the saved token; trying an unauthenticated temporary demo deployment."
            response="$(curl --silent --show-error -w '\n%{http_code}' \
              -X POST "https://ship.embarko.ai/apps" \
              -H "Accept: application/json" \
              -F "source=@/tmp/krayin-embed-demo.tar.gz;type=application/gzip")"
            http_code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            echo "$body"
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Embarko rejected the deployment request (HTTP $http_code)."
            exit 1
          fi

          app_name="$(echo "$body" | jq -r '.app.name // .name // empty')"
          if [ -z "$app_name" ]; then
            echo "::error::Embarko response did not contain an app name."
            exit 1
          fi
          echo "EMBARKO_APP_NAME=$app_name" >> "$GITHUB_ENV"
          echo "Submitted app: $app_name"

      - name: Wait for build result
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            sleep 15
            status="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $EMBARKO_DEPLOY_TOKEN" \
              "https://ship.embarko.ai/apps/$EMBARKO_APP_NAME/status")"
            echo "$status"
            state="$(echo "$status" | jq -r '.status // empty')"
            if [ "$state" = "live" ]; then
              app_url="$(echo "$status" | jq -r '.links.app // empty')"
              if [ -z "$app_url" ]; then
                echo "::error::Embarko reported live but did not provide links.app."
                exit 1
              fi
              echo "App is live: $app_url"
              exit 0
            fi
            if [ "$state" = "failed" ] || [ "$state" = "crashed" ]; then
              echo "Embarko deployment state: $state"
              curl --silent --show-error \
                -H "Authorization: Bearer $EMBARKO_DEPLOY_TOKEN" \
                "https://ship.embarko.ai/apps/$EMBARKO_APP_NAME/logs?stream=stderr" || true
              exit 1
            fi
          done
          echo "::error::Timed out waiting for Embarko build status."
          exit 1
