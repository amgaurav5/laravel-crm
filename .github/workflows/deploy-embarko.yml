name: Deploy Krayin demo to Embarko

on:
  push:
    branches:
      - feature/viasocket-embed
    paths:
      - '**'
      - '! .github/workflows/deploy-embarko.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4

      - name: Build source archive
        run: |
          tar -czf /tmp/krayin-embed-demo.tar.gz \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./vendor' \
            --exclude='./node_modules' \
            --exclude='./storage/logs' \
            .

      - name: Submit deployment to Embarko
        env:
          EMBARKO_DEPLOY_TOKEN: ${{ secrets.EMBARKO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$EMBARKO_DEPLOY_TOKEN" ]; then
            echo "::error::GitHub Actions secret EMBARKO_DEPLOY_TOKEN is not configured."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -X POST "https://ship.embarko.ai/apps" \
            -H "Authorization: Bearer $EMBARKO_DEPLOY_TOKEN" \
            -H "X-App-Name: krayin-viasocket-demo" \
            -H "Accept: application/json" \
            -F "source=@/tmp/krayin-embed-demo.tar.gz;type=application/gzip"

      - name: Wait for build result
        env:
          EMBARKO_DEPLOY_TOKEN: ${{ secrets.EMBARKO_DEPLOY_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            sleep 15
            status="$(curl --fail-with-body --silent --show-error \
              "https://ship.embarko.ai/apps/krayin-viasocket-demo/status")"
            echo "$status"
            if echo "$status" | grep -q '"status":"live"'; then
              exit 0
            fi
            if echo "$status" | grep -q '"status":"failed"'; then
              curl --silent --show-error \
                "https://ship.embarko.ai/apps/krayin-viasocket-demo/logs?stream=stderr" || true
              exit 1
            fi
          done
          echo "::error::Timed out waiting for Embarko build status."
          exit 1
